<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - React & LocalStorage</title>
    
    <!-- Load React, ReactDOM, Babel, and Tailwind via CDN for standalone execution -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Custom smooth transition for list items */
        .task-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Custom scrollbar for task list */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-indigo-200">
    
    <div id="root" class="flex-grow flex items-center justify-center p-4 md:p-8"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG Icons defined as components to avoid external dependencies
        const CheckCircleIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        );
        const CircleIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
        );
        const EditIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        );
        const TrashIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        );
        const SaveIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        );
        const XIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );

        const App = () => {
            // Initialize state dynamically from localStorage
            const [tasks, setTasks] = useState(() => {
                try {
                    const savedTasks = localStorage.getItem('taskTracker_tasks');
                    if (savedTasks) {
                        return JSON.parse(savedTasks);
                    }
                } catch (error) {
                    console.error("Error reading localStorage:", error);
                }
                return [];
            });

            const [newTaskText, setNewTaskText] = useState('');
            const [editingTaskId, setEditingTaskId] = useState(null);
            const [editTaskText, setEditTaskText] = useState('');
            const [filter, setFilter] = useState('all'); // all, active, completed

            // Save to localStorage whenever tasks array changes
            useEffect(() => {
                localStorage.setItem('taskTracker_tasks', JSON.stringify(tasks));
            }, [tasks]);

            // 1. CREATE
            const handleAddTask = (e) => {
                e.preventDefault();
                if (newTaskText.trim() === '') return;
                
                const newTask = {
                    id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
                    text: newTaskText.trim(),
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                
                setTasks([newTask, ...tasks]);
                setNewTaskText('');
            };

            // 2. UPDATE (Toggle Status)
            const handleToggleTask = (id) => {
                setTasks(tasks.map(task => 
                    task.id === id ? { ...task, completed: !task.completed } : task
                ));
            };

            // 3. UPDATE (Edit Text)
            const startEditing = (task) => {
                setEditingTaskId(task.id);
                setEditTaskText(task.text);
            };

            const saveEdit = (id) => {
                if (editTaskText.trim() === '') return;
                setTasks(tasks.map(task => 
                    task.id === id ? { ...task, text: editTaskText.trim() } : task
                ));
                setEditingTaskId(null);
            };

            const cancelEdit = () => {
                setEditingTaskId(null);
                setEditTaskText('');
            };

            // 4. DELETE
            const handleDeleteTask = (id) => {
                setTasks(tasks.filter(task => task.id !== id));
            };

            // Clear all completed
            const clearCompleted = () => {
                setTasks(tasks.filter(task => !task.completed));
            };

            // Derived state for filtered tasks
            const filteredTasks = tasks.filter(task => {
                if (filter === 'active') return !task.completed;
                if (filter === 'completed') return task.completed;
                return true;
            });

            const activeTaskCount = tasks.filter(task => !task.completed).length;

            return (
                <div className="w-full max-w-xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[85vh] max-h-[800px]">
                    
                    {/* Header Section */}
                    <div className="bg-indigo-600 px-6 py-8 text-white relative overflow-hidden flex-shrink-0">
                        {/* Decorative background circle */}
                        <div className="absolute -top-12 -right-12 w-48 h-48 bg-indigo-500 rounded-full opacity-50"></div>
                        
                        <h1 className="text-3xl font-extrabold relative z-10 tracking-tight mb-2">Tasks.</h1>
                        <p className="text-indigo-200 relative z-10 text-sm font-medium">
                            {activeTaskCount} {activeTaskCount === 1 ? 'task' : 'tasks'} remaining
                        </p>
                    </div>

                    {/* Input Section */}
                    <div className="p-6 bg-slate-50 border-b border-slate-100 flex-shrink-0">
                        <form onSubmit={handleAddTask} className="relative">
                            <input
                                type="text"
                                placeholder="What needs to be done?"
                                value={newTaskText}
                                onChange={(e) => setNewTaskText(e.target.value)}
                                className="w-full pl-6 pr-14 py-4 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all shadow-sm text-slate-700 bg-white placeholder-slate-400"
                            />
                            <button 
                                type="submit"
                                disabled={!newTaskText.trim()}
                                className="absolute right-2 top-2 bottom-2 aspect-square bg-indigo-600 text-white rounded-lg flex items-center justify-center hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                            </button>
                        </form>
                    </div>

                    {}
                    {/* Task List Section */}
                    <div className="flex-grow overflow-y-auto custom-scrollbar p-6 bg-white">
                        {tasks.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-slate-400 space-y-4">
                                <div className="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-2">
                                    <svg className="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                                </div>
                                <p className="text-lg font-medium">All caught up!</p>
                                <p className="text-sm">Add a task above to get started.</p>
                            </div>
                        ) : filteredTasks.length === 0 ? (
                            <div className="h-full flex items-center justify-center text-slate-400">
                                <p>No {filter} tasks found.</p>
                            </div>
                        ) : (
                            <ul className="space-y-3">
                                {filteredTasks.map(task => (
                                    <li 
                                        key={task.id} 
                                        className={`task-enter group flex items-center justify-between p-4 rounded-xl border transition-all ${
                                            task.completed 
                                                ? 'bg-slate-50 border-transparent shadow-sm' 
                                                : 'bg-white border-slate-200 shadow-sm hover:border-indigo-300 hover:shadow-md'
                                        }`}
                                    >
                                        {/* Edit Mode */}
                                        {editingTaskId === task.id ? (
                                            <div className="flex-grow flex items-center gap-3 w-full">
                                                <input 
                                                    type="text" 
                                                    value={editTaskText}
                                                    onChange={(e) => setEditTaskText(e.target.value)}
                                                    onKeyDown={(e) => {
                                                        if (e.key === 'Enter') saveEdit(task.id);
                                                        if (e.key === 'Escape') cancelEdit();
                                                    }}
                                                    autoFocus
                                                    className="flex-grow px-3 py-2 rounded-lg border border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100"
                                                />
                                                <button onClick={() => saveEdit(task.id)} className="text-emerald-600 hover:bg-emerald-50 p-2 rounded-md transition-colors" title="Save">
                                                    <SaveIcon className="w-5 h-5" />
                                                </button>
                                                <button onClick={cancelEdit} className="text-slate-500 hover:bg-slate-100 p-2 rounded-md transition-colors" title="Cancel">
                                                    <XIcon className="w-5 h-5" />
                                                </button>
                                            </div>
                                        ) : (
                                            /* Normal View Mode */
                                            <React.Fragment>
                                                <div className="flex items-center gap-4 overflow-hidden flex-grow cursor-pointer" onClick={() => handleToggleTask(task.id)}>
                                                    <button 
                                                        className={`flex-shrink-0 flex items-center justify-center transition-colors ${
                                                            task.completed ? 'text-emerald-500' : 'text-slate-300 hover:text-indigo-400'
                                                        }`}
                                                    >
                                                        {task.completed ? <CheckCircleIcon className="w-6 h-6" /> : <CircleIcon className="w-6 h-6" />}
                                                    </button>
                                                    
                                                    <span className={`block truncate text-base font-medium transition-all duration-200 ${
                                                        task.completed ? 'text-slate-400 line-through' : 'text-slate-700'
                                                    }`}>
                                                        {task.text}
                                                    </span>
                                                </div>
                                                
                                                {/* Action Buttons */}
                                                <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-4 flex-shrink-0">
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); startEditing(task); }}
                                                        className="text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 p-2 rounded-md transition-all"
                                                        title="Edit task"
                                                    >
                                                        <EditIcon className="w-4 h-4" />
                                                    </button>
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); handleDeleteTask(task.id); }}
                                                        className="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-md transition-all"
                                                        title="Delete task"
                                                    >
                                                        <TrashIcon className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            </React.Fragment>
                                        )}
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>

                    {}
                    {/* Footer Section */}
                    {tasks.length > 0 && (
                        <div className="bg-slate-50 border-t border-slate-200 p-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-slate-500 flex-shrink-0">
                            
                            {/* Filter Tabs */}
                            <div className="flex gap-2">
                                {['all', 'active', 'completed'].map(f => (
                                    <button 
                                        key={f}
                                        onClick={() => setFilter(f)}
                                        className={`capitalize px-3 py-1.5 rounded-lg font-medium transition-colors ${
                                            filter === f 
                                                ? 'bg-indigo-100 text-indigo-700' 
                                                : 'hover:bg-slate-200 text-slate-600'
                                        }`}
                                    >
                                        {f}
                                    </button>
                                ))}
                            </div>
                            
                            {/* Clear Completed */}
                            {tasks.some(task => task.completed) && (
                                <button 
                                    onClick={clearCompleted}
                                    className="hover:text-slate-800 hover:underline transition-all font-medium"
                                >
                                    Clear completed
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
