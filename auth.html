<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Auth UI</title>
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom utility classes for hiding elements and error states */
        .hidden-element { display: none !important; }
        .input-error { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 transition-all duration-300">
        
        <!-- Headers -->
        <div class="text-center mb-8">
            <h2 id="page-title" class="text-3xl font-bold text-slate-900 mb-2">Welcome Back</h2>
            <p id="page-subtitle" class="text-slate-500 text-sm">Please sign in to your account.</p>
        </div>

        <!-- Form Setup -->
        <form id="auth-form" novalidate>
            
            <!-- Name Field (Only visible during Registration) -->
            <div id="name-group" class="mb-5 hidden-element">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                <input type="text" id="name" placeholder="John Doe" 
                       class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" />
                <p id="name-error" class="text-red-500 text-xs mt-1 font-medium hidden-element"></p>
            </div>

            <!-- Email Field -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" 
                       class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" />
                <p id="email-error" class="text-red-500 text-xs mt-1 font-medium hidden-element"></p>
            </div>

            <!-- Password Field -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <input type="password" id="password" placeholder="••••••••" 
                       class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" />
                <p id="password-error" class="text-red-500 text-xs mt-1 font-medium hidden-element"></p>
                
                <div id="forgot-password" class="flex justify-end mt-2">
                    <a href="#" class="text-sm font-semibold text-blue-600 hover:text-blue-500 transition-colors">Forgot password?</a>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-md">
                Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="mt-8 flex items-center justify-between">
            <span class="border-b border-slate-200 w-1/5 lg:w-1/4"></span>
            <span class="text-xs text-center text-slate-500 uppercase font-semibold">Or continue with</span>
            <span class="border-b border-slate-200 w-1/5 lg:w-1/4"></span>
        </div>

        <!-- Social Buttons -->
        <div class="flex gap-4 mt-6">
            <button type="button" class="w-full flex items-center justify-center gap-2 border border-slate-300 rounded-lg py-2.5 hover:bg-slate-50 transition-colors font-semibold text-sm">
                <!-- Google SVG Icon -->
                <svg class="h-5 w-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Google
            </button>
            <button type="button" class="w-full flex items-center justify-center gap-2 border border-slate-300 rounded-lg py-2.5 hover:bg-slate-50 transition-colors font-semibold text-sm">
                <!-- GitHub SVG Icon -->
                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                GitHub
            </button>
        </div>

        <!-- Toggle Login/Register Mode -->
        <div class="mt-8 text-center text-sm">
            <span id="toggle-text" class="text-slate-500">Don't have an account?</span>
            <button type="button" id="toggle-btn" class="font-bold text-blue-600 hover:text-blue-700 ml-1 transition-colors">Sign up</button>
        </div>
    </div>

    <script>
        // DOM Elements setup
        const form = document.getElementById('auth-form');
        const title = document.getElementById('page-title');
        const subtitle = document.getElementById('page-subtitle');
        const nameGroup = document.getElementById('name-group');
        const forgotPassword = document.getElementById('forgot-password');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const toggleBtn = document.getElementById('toggle-btn');
        
        // Input fields
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // Error message elements
        const nameError = document.getElementById('name-error');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');

        // Application State
        let isLogin = true;

        // Validation Regular Expressions
        // Standard email format validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        // Password: Min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            
            // Reset form state on switch
            form.reset();
            clearErrors();

            if (isLogin) {
                // Switch to Login UI
                title.textContent = "Welcome Back";
                subtitle.textContent = "Please sign in to your account.";
                nameGroup.classList.add('hidden-element');
                forgotPassword.classList.remove('hidden-element');
                submitBtn.textContent = "Sign In";
                toggleText.textContent = "Don't have an account?";
                toggleBtn.textContent = "Sign up";
            } else {
                // Switch to Registration UI
                title.textContent = "Create an Account";
                subtitle.textContent = "Join us today! Enter your details below.";
                nameGroup.classList.remove('hidden-element');
                forgotPassword.classList.add('hidden-element');
                submitBtn.textContent = "Register Now";
                toggleText.textContent = "Already have an account?";
                toggleBtn.textContent = "Sign in";
            }
        });

        function clearErrors() {
            // Remove error styling from inputs
            [nameInput, emailInput, passwordInput].forEach(el => el.classList.remove('input-error'));
            // Hide error text messages
            [nameError, emailError, passwordError].forEach(el => {
                el.classList.add('hidden-element');
                el.textContent = "";
            });
        }

        function showError(input, errorElement, message) {
            // Apply error styling and show message
            input.classList.add('input-error');
            errorElement.textContent = message;
            errorElement.classList.remove('hidden-element');
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            clearErrors(); // Reset previous errors
            let hasError = false;

            // 1. Name Validation (Only when registering)
            if (!isLogin && nameInput.value.trim() === '') {
                showError(nameInput, nameError, 'Full name is required.');
                hasError = true;
            }

            // 2. Email Validation
            if (emailInput.value.trim() === '') {
                showError(emailInput, emailError, 'Email address is required.');
                hasError = true;
            } else if (!emailRegex.test(emailInput.value.trim())) {
                showError(emailInput, emailError, 'Please enter a valid email address.');
                hasError = true;
            }

            // 3. Password Validation (Strength Check)
            if (passwordInput.value === '') {
                showError(passwordInput, passwordError, 'Password is required.');
                hasError = true;
            } else if (!passwordRegex.test(passwordInput.value)) {
                showError(passwordInput, passwordError, 'Must be 8+ chars with uppercase, lowercase, number & special char.');
                hasError = true;
            }

            // 4. Success State (No errors found)
            if (!hasError) {
                // We use a console log here to simulate API request, and a custom message box instead of alert()
                const mode = isLogin ? 'Login' : 'Registration';
                const successMsg = `${mode} Successful!\n\nEmail: ${emailInput.value}`;
                
                // Show a simple custom success state in the UI instead of blocking alert()
                submitBtn.textContent = "Success!";
                submitBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                submitBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
                
                setTimeout(() => {
                    // Reset button after 2 seconds
                    submitBtn.textContent = isLogin ? "Sign In" : "Register Now";
                    submitBtn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
                    submitBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                    form.reset();
                }, 2000);
            }
        });
    </script>
</body>
</html>
